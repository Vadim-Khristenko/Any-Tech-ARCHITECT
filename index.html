<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Critical inline CSS: paint the dark canvas and reserve the viewport
             height before Vue mounts. Kills the white flash and the blank→app
             layout shift that was driving CLS to ~1.0 on first paint. -->
        <style>
            html {
                background: #0a0806;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                background: #0a0806;
                color: #e0d4b8;
                font-family:
                    "Manrope Variable", system-ui, -apple-system, sans-serif;
            }
            #app {
                min-height: 100dvh;
            }
        </style>

        <title>Any Tech ARCHITECT — генератор конфигов AmneziaWG и XRay REALITY</title>
        <meta
            name="description"
            content="Any Tech ARCHITECT (ранее AmneziaWG Architect) — генератор параметров обфускации для AmneziaWG 1.0–3.1 и XRay/REALITY. Junk-поезда, диапазоны заголовков H1–H4, CPS-подписи I1–I5 и двенадцать профилей мимикрии по RFC. Всё считается в браузере — ключи и параметры не покидают устройство."
        />
        <meta
            name="keywords"
            content="Any Tech Architect, AmneziaWG Architect, AmneziaWG generator, генератор AmneziaWG, генератор конфигов AmneziaWG, AWG генератор, XRay Architect, XRay REALITY generator, обфускация WireGuard, обход блокировок, DPI, VPN, VLESS"
        />

        <!-- Structured data for the tool as a whole. The old name lives in
             alternateName: people search for both "Any Tech ARCHITECT" and the
             "AmneziaWG Architect" it used to be, and the two must connect.
             Every route stub is built from this template, so the block rides
             along to every page. -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Any Tech ARCHITECT",
            "alternateName": [
                "AmneziaWG Architect",
                "AmneziaWG Generator",
                "XRay Architect",
                "XRay REALITY Generator"
            ],
            "url": "https://architect.vai-rice.space/",
            "description": "Генератор параметров обфускации для AmneziaWG 1.0–3.1 и XRay/REALITY: junk-поезда, диапазоны заголовков, CPS-подписи и профили мимикрии. Всё считается в браузере.",
            "applicationCategory": "SecurityApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "inLanguage": ["ru", "en"],
            "featureList": [
                "AmneziaWG 1.0–3.1 configuration generator",
                "XRay / REALITY / VLESS configuration generator",
                "CPS signature chains (I1–I5) with per-tag control",
                "Twelve mimicry profiles: QUIC, TLS 1.3, DTLS 1.2, DTLS 1.3, HTTP/3, SIP, DNS",
                "vpn:// key merging and editing (MergeKeys)",
                "Packet simulator for AmneziaWG and XRay handshakes",
                "Client compatibility matrix for 13 clients",
                "Everything computed locally in the browser"
            ]
        }
        </script>

        <!-- Favicons -->
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="/assets/favicon-96x96.png"
        />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/apple-touch-icon.png"
        />
        <link rel="manifest" href="/assets/site.webmanifest" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Any Tech ARCHITECT — генератор конфигов AmneziaWG и XRay"
        />
        <meta
            property="og:description"
            content="Генератор параметров обфускации для AmneziaWG 1.0–3.1 и XRay/REALITY: Jc, Jmin, Jmax, S1–S4, H1–H4, CPS I1–I5. Профили мимикрии QUIC/TLS/DTLS/SIP. Всё в браузере."
        />
        <meta property="og:image" content="/assets/og-image.png" />
        <meta name="apple-mobile-web-app-title" content="AWG-AiT" />

        <!-- Fonts are self-hosted and bundled (see src/main.ts →
             @fontsource-variable/*). No third-party font requests: the UI stays
             fully styled even when fonts.gstatic.com is throttled or blocked. -->
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="src/main.ts"></script>
    </body>
</html>
